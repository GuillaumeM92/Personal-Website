# /etc/nginx/sites-enabled/personal_website
# Site statique Astro, servi directement par nginx (plus de gunicorn).

server {
    server_name guillaume-merle.fr www.guillaume-merle.fr;
    root /var/www/guillaume-merle.fr;
    index index.html;

    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Anciennes adresses du site Django.
    rewrite ^/about/?$        /              permanent;
    rewrite ^/portfolio/?$    /#projets      permanent;
    rewrite ^/about-en/?$     /en/           permanent;
    rewrite ^/portfolio-en/?$ /en/#projects  permanent;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Fichiers générés par Astro : leur nom change à chaque version.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/famille.guillaume-merle.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/famille.guillaume-merle.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.guillaume-merle.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = guillaume-merle.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name guillaume-merle.fr www.guillaume-merle.fr;
    listen 80;
    return 404; # managed by Certbot
}
